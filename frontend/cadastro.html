<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Cadastro - Avaliação de Filmes</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="container">
        <div class="login-container">
            <h2>🎬 Criar conta</h2>
            <p class="subtitle">Cadastre-se para começar</p>
            
            <div id="cadastroForm">
                <div class="form-group">
                    <label>👤 Nome completo</label>
                    <input type="text" id="cadastroNome" placeholder="Seu nome" autocomplete="off">
                </div>
                <div class="form-group">
                    <label>📧 Email</label>
                    <input type="email" id="cadastroEmail" placeholder="seu@email.com" autocomplete="off">
                </div>
                <div class="form-group">
                    <label>🔒 Senha</label>
                    <input type="password" id="cadastroSenha" placeholder="Crie uma senha">
                </div>
                <div class="form-group">
                    <label>🔒 Confirmar senha</label>
                    <input type="password" id="cadastroConfirmarSenha" placeholder="Confirme sua senha">
                </div>
                <button onclick="window.fazerCadastro()">Cadastrar</button>
                <div class="toggle-form">
                    <a href="login.html">Já tem conta? Faça login</a>
                </div>
                <div id="cadastroMessage"></div>
            </div>
        </div>
    </div>

    <script src="script.js"></script>
</body>
</html>
