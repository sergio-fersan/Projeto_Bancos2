<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sistema de Avaliação de Filmes</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            padding: 20px;
        }
        
        .container {
            max-width: 1200px;
            margin: 0 auto;
        }
        
        /* Tela de Login */
        .login-container, .app-container {
            background: white;
            border-radius: 10px;
            padding: 30px;
            box-shadow: 0 20px 60px rgba(0,0,0,0.3);
        }
        
        .login-container {
            max-width: 400px;
            margin: 100px auto;
        }
        
        .login-container h2 {
            text-align: center;
            color: #333;
            margin-bottom: 30px;
        }
        
        .form-group {
            margin-bottom: 15px;
        }
        
        .form-group label {
            display: block;
            margin-bottom: 5px;
            color: #666;
        }
        
        .form-group input {
            width: 100%;
            padding: 10px;
            border: 1px solid #ddd;
            border-radius: 5px;
            font-size: 16px;
        }
        
        button {
            width: 100%;
            padding: 12px;
            background: #667eea;
            color: white;
            border: none;
            border-radius: 5px;
            font-size: 16px;
            cursor: pointer;
            margin-top: 10px;
        }
        
        button:hover {
            background: #5a67d8;
        }
        
        .toggle-form {
            text-align: center;
            margin-top: 15px;
        }
        
        .toggle-form a {
            color: #667eea;
            cursor: pointer;
            text-decoration: none;
        }
        
        .error {
            color: red;
            font-size: 14px;
            margin-top: 10px;
            text-align: center;
        }
        
        .success {
            color: green;
            font-size: 14px;
            margin-top: 10px;
            text-align: center;
        }
        
        /* App Container (depois do login) */
        .app-container {
            display: none;
        }
        
        .header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 30px;
            padding-bottom: 20px;
            border-bottom: 2px solid #eee;
        }
        
        .user-info {
            display: flex;
            align-items: center;
            gap: 15px;
        }
        
        .logout-btn {
            background: #e53e3e;
            width: auto;
            padding: 8px 20px;
            margin: 0;
        }
        
        .logout-btn:hover {
            background: #c53030;
        }
        
        .section {
            background: #f7f7f7;
            padding: 20px;
            border-radius: 8px;
            margin-bottom: 30px;
        }
        
        .section h2 {
            margin-bottom: 15px;
            color: #333;
        }
        
        .filmes-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(250px, 1fr));
            gap: 20px;
            margin-top: 20px;
        }
        
        .filme-card {
            background: white;
            padding: 15px;
            border-radius: 8px;
            box-shadow: 0 2px 5px rgba(0,0,0,0.1);
        }
        
        .filme-card h3 {
            color: #667eea;
            margin-bottom: 10px;
        }
        
        .avaliacao-form {
            margin-top: 15px;
            padding-top: 15px;
            border-top: 1px solid #eee;
        }
        
        .avaliacao-form select, 
        .avaliacao-form textarea {
            width: 100%;
            margin-bottom: 10px;
            padding: 8px;
            border: 1px solid #ddd;
            border-radius: 4px;
        }
        
        .avaliacao-form textarea {
            height: 60px;
        }
        
        .avaliacao-btn {
            background: #48bb78;
            width: auto;
            padding: 8px 15px;
            margin: 0;
        }
        
        .minhas-avaliacoes {
            margin-top: 20px;
        }
        
        .avaliacao-item {
            background: white;
            padding: 15px;
            margin-bottom: 10px;
            border-radius: 8px;
            border-left: 4px solid #667eea;
        }
        
        .recomendado {
            border-left-color: #48bb78;
        }
        
        .nao-recomendado {
            border-left-color: #e53e3e;
        }
    </style>
</head>
<body>
    <div class="container">
        <!-- Tela de Login -->
        <div id="loginContainer" class="login-container">
            <h2>🎬 Sistema de Avaliação de Filmes</h2>
            
            <div id="loginForm">
                <div class="form-group">
                    <label>Email</label>
                    <input type="email" id="loginEmail" placeholder="demo@email.com">
                </div>
                <div class="form-group">
                    <label>Senha</label>
                    <input type="password" id="loginSenha" placeholder="123456">
                </div>
                <button onclick="fazerLogin()">Entrar</button>
                <div class="toggle-form">
                    <a onclick="mostrarCadastro()">Não tem conta? Cadastre-se</a>
                </div>
                <div id="loginMessage"></div>
            </div>
            
            <div id="cadastroForm" style="display:none;">
                <div class="form-group">
                    <label>Nome</label>
                    <input type="text" id="cadastroNome" placeholder="Seu nome">
                </div>
                <div class="form-group">
                    <label>Email</label>
                    <input type="email" id="cadastroEmail" placeholder="seu@email.com">
                </div>
                <div class="form-group">
                    <label>Senha</label>
                    <input type="password" id="cadastroSenha" placeholder="Crie uma senha">
                </div>
                <button onclick="fazerCadastro()">Cadastrar</button>
                <div class="toggle-form">
                    <a onclick="mostrarLogin()">Já tem conta? Faça login</a>
                </div>
                <div id="cadastroMessage"></div>
            </div>
        </div>
        
        <!-- App Principal (depois do login) -->
        <div id="appContainer" class="app-container">
            <div class="header">
                <h1>🎬 Avaliação de Filmes</h1>
                <div class="user-info">
                    <span>👤 <span id="userName"></span></span>
                    <button class="logout-btn" onclick="fazerLogout()">Sair</button>
                </div>
            </div>
            
            <!-- Lista de Filmes para avaliar -->
            <div class="section">
                <h2>🎥 Filmes para Avaliar</h2>
                <div id="filmesLista" class="filmes-grid"></div>
            </div>
            
            <!-- Minhas Avaliações -->
            <div class="section">
                <h2>⭐ Minhas Avaliações</h2>
                <div id="minhasAvaliacoes" class="minhas-avaliacoes"></div>
            </div>
        </div>
    </div>

    <script>
        const API_URL = 'http://localhost:3000';
        let usuarioAtual = null;
        
        // Carregar usuário do localStorage ao iniciar
        window.onload = () => {
            const savedUser = localStorage.getItem('usuario');
            if (savedUser) {
                usuarioAtual = JSON.parse(savedUser);
                entrarNoApp();
            }
        };
        
        // Funções de Login/Cadastro
        async function fazerLogin() {
            const email = document.getElementById('loginEmail').value;
            const senha = document.getElementById('loginSenha').value;
            
            const response = await fetch(`${API_URL}/api/login`, {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ email, senha })
            });
            
            const data = await response.json();
            
            if (response.ok) {
                usuarioAtual = data.user;
                localStorage.setItem('usuario', JSON.stringify(usuarioAtual));
                entrarNoApp();
            } else {
                document.getElementById('loginMessage').innerHTML = 
                    `<div class="error">${data.error}</div>`;
            }
        }
        
        async function fazerCadastro() {
            const nome = document.getElementById('cadastroNome').value;
            const email = document.getElementById('cadastroEmail').value;
            const senha = document.getElementById('cadastroSenha').value;
            
            const response = await fetch(`${API_URL}/api/cadastro`, {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ nome, email, senha })
            });
            
            const data = await response.json();
            
            if (response.ok) {
                document.getElementById('cadastroMessage').innerHTML = 
                    '<div class="success">Cadastro realizado! Faça login.</div>';
                setTimeout(() => mostrarLogin(), 1500);
            } else {
                document.getElementById('cadastroMessage').innerHTML = 
                    `<div class="error">${data.error}</div>`;
            }
        }
        
        function mostrarCadastro() {
            document.getElementById('loginForm').style.display = 'none';
            document.getElementById('cadastroForm').style.display = 'block';
            document.getElementById('loginMessage').innerHTML = '';
            document.getElementById('cadastroMessage').innerHTML = '';
        }
        
        function mostrarLogin() {
            document.getElementById('loginForm').style.display = 'block';
            document.getElementById('cadastroForm').style.display = 'none';
            document.getElementById('loginMessage').innerHTML = '';
            document.getElementById('cadastroMessage').innerHTML = '';
        }
        
        function fazerLogout() {
            usuarioAtual = null;
            localStorage.removeItem('usuario');
            document.getElementById('loginContainer').style.display = 'block';
            document.getElementById('appContainer').style.display = 'none';
            document.getElementById('loginEmail').value = '';
            document.getElementById('loginSenha').value = '';
        }
        
        // App principal
        async function entrarNoApp() {
            document.getElementById('loginContainer').style.display = 'none';
            document.getElementById('appContainer').style.display = 'block';
            document.getElementById('userName').innerHTML = usuarioAtual.nome;
            
            await carregarFilmes();
            await carregarMinhasAvaliacoes();
        }
        
        async function carregarFilmes() {
            const response = await fetch(`${API_URL}/api/filmes`);
            const filmes = await response.json();
            
            const filmesDiv = document.getElementById('filmesLista');
            filmesDiv.innerHTML = filmes.map(filme => `
                <div class="filme-card">
                    <h3>${filme.titulo}</h3>
                    <p><strong>Diretor:</strong> ${filme.diretor}</p>
                    <p><strong>Ano:</strong> ${filme.ano}</p>
                    <p><strong>Gênero:</strong> ${filme.genero}</p>
                    
                    <div class="avaliacao-form">
                        <select id="nota-${filme._id}">
                            <option value="10">10 - Excelente</option>
                            <option value="9">9 - Ótimo</option>
                            <option value="8">8 - Muito Bom</option>
                            <option value="7">7 - Bom</option>
                            <option value="6">6 - Regular</option>
                            <option value="5">5 - Mediano</option>
                            <option value="4">4 - Ruim</option>
                            <option value="3">3 - Muito Ruim</option>
                            <option value="2">2 - Péssimo</option>
                            <option value="1">1 - Horroroso</option>
                        </select>
                        <textarea id="comentario-${filme._id}" placeholder="Seu comentário..."></textarea>
                        <label>
                            <input type="checkbox" id="recomendo-${filme._id}"> Recomendo este filme
                        </label>
                        <button class="avaliacao-btn" onclick="avaliarFilme('${filme._id}', '${filme.titulo}')">
                            Avaliar
                        </button>
                    </div>
                </div>
            `).join('');
        }
        
        async function avaliarFilme(filmeId, titulo) {
            const nota = document.getElementById(`nota-${filmeId}`).value;
            const comentario = document.getElementById(`comentario-${filmeId}`).value;
            const recomendado = document.getElementById(`recomendo-${filmeId}`).checked;
            
            const response = await fetch(`${API_URL}/api/avaliacoes`, {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({
                    userId: usuarioAtual.id,
                    filmeId: filmeId,
                    nota: nota,
                    comentario: comentario,
                    recomendado: recomendado
                })
            });
            
            if (response.ok) {
                alert(`✅ "${titulo}" avaliado com sucesso!`);
                document.getElementById(`comentario-${filmeId}`).value = '';
                document.getElementById(`recomendo-${filmeId}`).checked = false;
                await carregarMinhasAvaliacoes();
            } else {
                const error = await response.json();
                alert(`Erro: ${error.error}`);
            }
        }
        
        async function carregarMinhasAvaliacoes() {
            const response = await fetch(`${API_URL}/api/minhas-avaliacoes/${usuarioAtual.id}`);
            const avaliacoes = await response.json();
            
            const avaliacoesDiv = document.getElementById('minhasAvaliacoes');
            
            if (avaliacoes.length === 0) {
                avaliacoesDiv.innerHTML = '<p>Você ainda não avaliou nenhum filme.</p>';
                return;
            }
            
            avaliacoesDiv.innerHTML = avaliacoes.map(av => `
                <div class="avaliacao-item ${av.recomendado ? 'recomendado' : 'nao-recomendado'}">
                    <h3>${av.titulo}</h3>
                    <p><strong>Nota:</strong> ${av.nota}/10</p>
                    <p><strong>Comentário:</strong> ${av.comentario || 'Sem comentário'}</p>
                    <p><strong>Recomendo:</strong> ${av.recomendado ? '✅ Sim' : '❌ Não'}</p>
                    <small>${new Date(av.data).toLocaleDateString()}</small>
                </div>
            `).join('');
        }
    </script>
</body>
</html>
