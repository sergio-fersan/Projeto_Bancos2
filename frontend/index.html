<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sistema de Avaliação de Filmes</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="container">
        <!-- Tela de Login -->
        <div id="loginContainer" class="login-container">
            <h2>🎬 Sistema de Avaliação de Filmes</h2>
            
            <div id="loginForm">
                <div class="form-group">
                    <label>Email</label>
                    <input type="email" id="loginEmail" placeholder="demo@email.com">
                </div>
                <div class="form-group">
                    <label>Senha</label>
                    <input type="password" id="loginSenha" placeholder="123456">
                </div>
                <button onclick="window.fazerLogin()">Entrar</button>
                <div class="toggle-form">
                    <a onclick="window.mostrarCadastro()">Não tem conta? Cadastre-se</a>
                </div>
                <div id="loginMessage"></div>
            </div>
            
            <div id="cadastroForm" style="display:none;">
                <div class="form-group">
                    <label>Nome</label>
                    <input type="text" id="cadastroNome" placeholder="Seu nome">
                </div>
                <div class="form-group">
                    <label>Email</label>
                    <input type="email" id="cadastroEmail" placeholder="seu@email.com">
                </div>
                <div class="form-group">
                    <label>Senha</label>
                    <input type="password" id="cadastroSenha" placeholder="Crie uma senha">
                </div>
                <button onclick="window.fazerCadastro()">Cadastrar</button>
                <div class="toggle-form">
                    <a onclick="window.mostrarLogin()">Já tem conta? Faça login</a>
                </div>
                <div id="cadastroMessage"></div>
            </div>
        </div>
        
        <!-- App Principal (depois do login) -->
        <div id="appContainer" class="app-container">
            <div class="header">
                <h1>🎬 Avaliação de Filmes</h1>
                <div class="user-info">
                    <span>👤 <span id="userName"></span></span>
                    <button class="logout-btn" onclick="window.fazerLogout()">Sair</button>
                </div>
            </div>
            
            <!-- Lista de Filmes para avaliar -->
            <div class="section">
                <h2>🎥 Filmes para Avaliar</h2>
                <div id="filmesLista" class="filmes-grid"></div>
            </div>
            
            <!-- Minhas Avaliações -->
            <div class="section">
                <h2>⭐ Minhas Avaliações</h2>
                <div id="minhasAvaliacoes" class="minhas-avaliacoes"></div>
            </div>
        </div>
    </div>

    <script src="script.js"></script>
</body>
</html>
