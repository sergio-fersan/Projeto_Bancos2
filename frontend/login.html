<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login - FEIboxd</title>
    <link rel="stylesheet" href="estilo.css">
</head>
<body>
    <div class="container">
        <div class="login-container">
            <h1>🎬 Bem-vindo de volta!</h1>
            <h2 class="subtitle">Faça login para continuar</h2>
            
            <div id="loginForm">
                <div class="form-group">
                    <label>📧 Email</label>
                    <input type="email" id="loginEmail" placeholder="fulano@email.com" autocomplete="off">
                </div>
                <div class="form-group">
                    <label>🔒 Senha</label>
                    <input type="password" id="loginSenha" placeholder="********">
                </div>
                <button class="btn" onclick="window.fazerLogin()">Entrar</button>
                <div class="link">
                    <a href="cadastro.html">Não tem conta? Cadastre-se</a>
                </div>
                <div id="loginMessage"></div>
            </div>
        </div>
    </div>

    <script src="script.js"></script>
</body>
</html>
